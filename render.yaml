# ─────────────────────────────────────────────────────────────────────────────
# INSTÂNCIA DEDICADA: MAIS VAREJO
#
# Fork do Mavo Talk (base: willy-henrique/willtalk, remote `upstream`).
# Um cliente = uma instância: WhatsApp, projeto Supabase e workspace Render
# próprios. Ver docs/CLIENTE-MAIS-VAREJO.md e docs/PROVISIONAR-NOVO-CLIENTE.md.
#
# Os hostnames abaixo assumem que o Render aceitou os nomes de serviço sem
# sufixo. O hostname `.onrender.com` é GLOBAL: se o Render gerar uma URL com
# sufixo, corrija ANTES do primeiro deploy as seis variáveis de URL —
# MAVO_API_PUBLIC_URL, TWILIO_WEBHOOK_BASE_URL, FRONTEND_URL,
# MAVO_ALLOWED_ORIGINS (serviço web) e VITE_API_BASE_URL / VITE_SOCKET_URL
# (serviço estático). URL errada = CORS bloqueado e socket sem conectar.
# ─────────────────────────────────────────────────────────────────────────────
# Blueprint validado contra https://render.com/schema/render.yaml.json.
# O PostgreSQL é externo (Supabase); este Blueprint não cria Render Postgres.
#
# ATENÇÃO — este Blueprint usa exclusivamente instâncias GRATUITAS. Isso impõe
# limites reais, documentados em docs/DEPLOY-SUPABASE-RENDER.md:
#   - a sessão do WhatsApp é cifrada e persistida no Supabase, sem depender do
#     filesystem efêmero da instância;
#   - o serviço web hiberna após 15 min sem tráfego e leva ~1 min para acordar;
#   - Background Worker não tem plano gratuito, então as filas rodam dentro do
#     processo web via MAVO_INLINE_WORKER=true;
#   - preDeployCommand exige plano pago, então as migrations rodam no build;
#   - o Key Value gratuito não tem persistência: a fila é best-effort.
previews:
  generation: off

services:
  - type: web
    name: mavotalk-maisvarejo-api
    runtime: node
    region: virginia
    plan: free
    # Cada etapa tem teto. `npm ci` e `next build` são limitados por `timeout`
    # (sai 124 e falha o build); as etapas de banco se limitam sozinhas via
    # runDeployStep em scripts/db-common.mjs. Sem isso um passo pendurado deixa
    # o deploy em "Building" até o limite da plataforma, sem log de erro.
    buildCommand: timeout 900 npm ci --include=dev && timeout 1500 npm run build && npm run db:migrate && npm run db:bootstrap:production && npm run db:verify
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DB_PROVIDER
        value: supabase
      - key: DATABASE_URL_RUNTIME
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PG_SSL
        value: "true"
      # Instância gratuita tem pouca memória e o Supabase free tem limite baixo
      # de conexões: pool enxuto.
      - key: PG_POOL_MAX
        value: "3"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: PG_IDLE_TIMEOUT_MS
        value: "30000"
      - key: PG_APPLICATION_NAME
        value: mavotalk-maisvarejo-api
      # Tetos das etapas de banco do build (scripts/db-common.mjs). Ajustáveis
      # pelo painel sem novo commit quando uma migration legítima demorar mais.
      - key: DB_STEP_DEADLINE_MS
        value: "600000"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "300000"
      - key: DB_LOCK_TIMEOUT_MS
        value: "15000"
      - key: DB_LOCK_ATTEMPTS
        value: "10"
      - key: DB_LOCK_WAIT_MS
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: MAVO_METRICS_TOKEN
        sync: false
      - key: MAVO_MANAGEMENT_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: mavo_talk_session
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_URL
        value: https://mavotalk-maisvarejo-web.onrender.com
      - key: MAVO_ALLOWED_ORIGINS
        value: https://mavotalk-maisvarejo-web.onrender.com
      - key: MAVO_API_PUBLIC_URL
        value: https://mavotalk-maisvarejo-api.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mavotalk-maisvarejo-key-value
          property: connectionString
      - key: MAVO_QUEUE_ENV
        value: production
      # Sem Background Worker no plano gratuito: filas rodam no processo web.
      - key: MAVO_INLINE_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "2"
      # Baileys (WhatsApp via QR) como canal principal: sem Chromium. Twilio
      # fica configurado como fallback automático.
      # Ver sendTriageMessageToWhatsApp em lib/whatsapp-client.ts.
      - key: WHATSAPP_PROVIDER
        value: unofficial
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_WEBHOOK_BASE_URL
        value: https://mavotalk-maisvarejo-api.onrender.com
      - key: WHATSAPP_AUTH_PATH
        value: /tmp/whatsapp_auth
      - key: WHATSAPP_AUTH_STORE
        value: database
      - key: WHATSAPP_AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_SESSION_NAME
        value: mavotalk-maisvarejo
      # Somente usado pelo fallback filesystem.
      - key: WHATSAPP_ALLOW_EPHEMERAL_SESSION
        value: "false"
      - key: WHATSAPP_AUTO_CONNECT
        value: "true"
      - key: DEFAULT_ORG_ID
        value: org_maisvarejo
      - key: WILLTALK_WEBHOOK_TOKEN
        generateValue: true
      - key: WILLTALK_WEBHOOK_ORGANIZATION_ID
        value: org_maisvarejo
      - key: WILLTALK_AI_TRIAGE_ONLY
        value: "true"
      - key: WILLTALK_N8N_ONLY
        value: "false"
      - key: WILLTALK_DRY_RUN_WHATSAPP
        value: "false"
      - key: SUPERMARKET_BOT_ENABLED
        value: "false"
      - key: SUPERMARKET_AUTO_APPLY_PRESET
        value: "false"
      - key: SUPERMARKET_BOT_NAME
        value: Mavo
      - key: SUPERMARKET_NAME
        sync: false
      - key: SUPERMARKET_ADDRESS
        sync: false
      - key: SUPERMARKET_MAPS_URL
        sync: false
      - key: SUPERMARKET_HOURS_WEEKDAYS
        sync: false
      - key: SUPERMARKET_HOURS_SUNDAY
        sync: false
      - key: SUPERMARKET_OFFERS_URL
        sync: false
      - key: SUPERMARKET_OFFERS_TEXT
        sync: false
      - key: SUPERMARKET_OFFERS_IMAGE_URL
        sync: false
      - key: SUPERMARKET_OFFERS_IMAGE_PUBLIC_ID
        sync: false
      - key: SUPERMARKET_PHONE
        sync: false
      - key: SUPERMARKET_AI_FALLBACK_ENABLED
        value: "false"
      - key: BUSINESS_HOURS_WEEKDAY_START
        value: "07:00"
      - key: BUSINESS_HOURS_WEEKDAY_END
        value: "21:00"
      - key: BUSINESS_HOURS_WEEKDAY_CLOSED
        value: "false"
      - key: BUSINESS_HOURS_SATURDAY_START
        value: "07:00"
      - key: BUSINESS_HOURS_SATURDAY_END
        value: "21:00"
      - key: BUSINESS_HOURS_SATURDAY_CLOSED
        value: "false"
      - key: BUSINESS_HOURS_SUNDAY_START
        value: "08:00"
      - key: BUSINESS_HOURS_SUNDAY_END
        value: "14:00"
      - key: BUSINESS_HOURS_SUNDAY_CLOSED
        value: "false"
      - key: MAVO_BUSINESS_ANALYTICS_ENABLED
        value: "true"
      - key: MAVO_BUSINESS_ACCESS_ENABLED
        value: "true"
      - key: MAVO_AGENT_API_ENABLED
        value: "true"
      - key: MAVO_MCP_ENABLED
        value: "false"
      - key: MAVO_AGENT_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: MAVO_AGENT_CLOCK_TOLERANCE_SECONDS
        value: "300"
      - key: MAVO_AGENT_MAX_PAYLOAD_BYTES
        value: "1048576"
      - key: MAVO_AGENT_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAVO_AGENT_NEXT_SYNC_SECONDS
        value: "300"
      - key: MAVO_BUSINESS_SESSION_TTL_MINUTES
        value: "15"
      - key: MAVO_BUSINESS_PIN_MAX_ATTEMPTS
        value: "5"
      - key: MAVO_BUSINESS_PIN_LOCK_MINUTES
        value: "15"
      - key: MAVO_BUSINESS_QUERY_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAVO_DEFAULT_TIMEZONE
        value: America/Sao_Paulo
      - key: MAVO_DEFAULT_CURRENCY
        value: BRL
      - key: MAVO_MASTER_EMAIL
        sync: false
      - key: MAVO_MASTER_PASSWORD
        sync: false
      - key: MAVO_MASTER_NAME
        value: Administrador Mais Varejo
      - key: MAVO_AI_BASE_URL
        sync: false
      - key: MAVO_AI_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: mavotalk-maisvarejo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mavotalk-maisvarejo-api.onrender.com
      - key: VITE_SOCKET_URL
        value: https://mavotalk-maisvarejo-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        # microphone=(self): o atendente grava nota de voz pelo painel. A lista
        # vazia proibia o microfone inclusive para a propria origem, e o pedido
        # falhava antes mesmo de o navegador perguntar ao usuario.
        value: camera=(), microphone=(self), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: mavotalk-maisvarejo-key-value
    region: virginia
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
